# ── nginx.conf ─────────────────────────────────────────────────
# Serves the React SPA and reverse-proxies /api/* to the backend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy all API requests to the FastAPI backend.
    # "backend" matches the Docker Compose service name.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Serve the SPA; fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
